[package]
name = "lis_ultrawide_camera"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Ultrawide camera fix for Life is Strange: Double Exposure, applied in memory when the game starts"
publish = false

[lib]
# cdylib is the DLL the game loads; rlib lets the tests (and later the
# installer) call the same code.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
winresource = "0.1"
