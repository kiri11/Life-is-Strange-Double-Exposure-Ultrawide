# Builds LiSUltrawidePatcher.exe from LiSUltrawidePatcher.cs and, for pushes to
# main, publishes it as a release. The exe is deliberately NOT in the repository:
# a committed binary drifts from the source next to it, and nobody can tell by
# looking. Here the only exe that exists is the one this file just compiled.
#
# Every push to main cuts its own release and no release is ever overwritten, so
# a build that turns out bad can always be compared against the one before it.
# Put [skip ci] in the commit subject to push without releasing.
#
# Each release carries two archives with the same contents, except that the
# second also holds python.org's embeddable Python, so the GUI never has to
# download one. That is the archive for mod sites, whose rules frown on files
# that fetch things from the internet; the small one is for everyone else.
name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The Kraken decoder is plain Python and has to give the same bytes on every
  # platform the fix claims - so the same vectors are decoded on Linux and on
  # Windows, with the oldest Python the runners offer and the newest. The
  # path test builds a fake Steam layout in a temporary home; the Linux run is
  # the only Linux this project is ever tried on.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.8', '3.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python tests/test_kraken.py -v
      - run: python tests/test_paths.py

  build:
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # One version number for the whole fix, written here rather than kept in
      # step by hand: the date and this run's number, which is also the release
      # tag. Stamping it into both files before the compile means the exe, the
      # installer and the tag can never disagree about which build they are.
      - name: Stamp the version
        shell: pwsh
        run: |
          $version = '{0}.{1}' -f (Get-Date -Format 'yyyy.MM.dd'), $env:GITHUB_RUN_NUMBER
          # AssemblyVersion takes bare numbers - no zero padding, no leading zeros
          $numeric = ($version -split '\.' | ForEach-Object { [int]$_ }) -join '.'
          Write-Host "version $version (assembly $numeric)"
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8NoBOM

          $py = Get-Content patcher.py -Raw
          $py = $py -replace '(?m)^VERSION = ".+"$', "VERSION = `"$version`""
          Set-Content patcher.py $py -NoNewline -Encoding utf8NoBOM

          $cs = Get-Content LiSUltrawidePatcher.cs -Raw
          $cs = $cs -replace 'AssemblyVersion\(".+?"\)', "AssemblyVersion(`"$numeric`")"
          $cs = $cs -replace 'AssemblyFileVersion\(".+?"\)', "AssemblyFileVersion(`"$numeric`")"
          $cs = $cs -replace 'AssemblyInformationalVersion\(".+?"\)', "AssemblyInformationalVersion(`"$version`")"
          Set-Content LiSUltrawidePatcher.cs $cs -NoNewline -Encoding utf8NoBOM

          Select-String -Path patcher.py -Pattern '^VERSION'
          Select-String -Path LiSUltrawidePatcher.cs -Pattern 'Assembly.*Version\('

      # The stock .NET Framework compiler, present on every Windows image and on
      # every Windows the fix targets. No SDK, no csproj, no restore step. Keep
      # this line and the one in LiSUltrawidePatcher.cs's header identical.
      - name: Compile LiSUltrawidePatcher.exe
        shell: cmd
        run: >
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe
          /win32icon:LiSUltrawidePatcher.ico
          /out:LiSUltrawidePatcher.exe LiSUltrawidePatcher.cs
          /r:System.dll /r:System.Windows.Forms.dll /r:System.Drawing.dll
          /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll

      # What a user needs to run the fix, plus the one file the license needs.
      # tools/assetdump is not optional: patcher.py shells out to
      # patch_ui_layout.py for the full-width UI step, so a zip without it
      # silently installs three of the four parts. LiSUltrawidePatcher.cs is not on the runtime path either,
      # but it is the exe's source, and shipping it makes the archive its own
      # corresponding source under GPL-3 section 6 - so a download from a mod
      # site carries everything the license promises, with no link to follow.
      # The research scripts (audit_offsets, pak, usmap, verify_kraken,
      # make_kraken_vectors), the tests, RESEARCH.md and make_icon.py are not
      # on the runtime path and stay in the repository only.
      - name: Stage the release files
        shell: pwsh
        run: |
          $root = 'staging/LiS-DE-Ultrawide-Fix'
          New-Item -ItemType Directory -Path "$root/tools/assetdump" -Force | Out-Null
          $top = @(
            'LiSUltrawidePatcher.exe',   # the GUI front-end, built above
            'LiSUltrawidePatcher.cs',    # its source - the zip is GPL-complete
            'patcher.py',                # the installer, and all the patch logic
            'README.md',                 # install and troubleshooting instructions
            'LICENSE'                    # GPL-3.0: the binary must carry its terms
          )
          $assetdump = @(
            'patch_ui_layout.py',        # entry point patcher.py invokes
            'container.py',              # writes the mod container it installs
            'iostore.py', 'zen.py', 'slots.py', 'unver.py',  # container readers
            'kraken.py',                 # pure-Python Oodle Kraken decoder
            'oodle.py',                  # the readers' decompress() entry point
            'blake3_pure.py',            # stdlib BLAKE3, so no wheel is required
            'README.md'                  # what each of these files is
          )
          foreach ($f in $top) { Copy-Item $f "$root/$f" }
          foreach ($f in $assetdump) { Copy-Item "tools/assetdump/$f" "$root/tools/assetdump/$f" }
          Compress-Archive -Path $root -DestinationPath 'LiS-DE-Ultrawide-Fix.zip'
          Get-ChildItem -Recurse $root | Select-Object FullName, Length

      # The same files plus python.org's embeddable build, unpacked into
      # tools/python - the place LiSUltrawidePatcher.cs looks before it would
      # download one. The URL is read from the .cs so the two cannot disagree;
      # the digest is pinned here and has to be updated with it, so a swapped
      # download fails the build rather than shipping.
      - name: Stage the archive with Python bundled
        shell: pwsh
        run: |
          $url = (Select-String -Path LiSUltrawidePatcher.cs -Pattern 'https://www\.python\.org/ftp/python/[^"]+-embed-amd64\.zip').Matches[0].Value
          $sha256 = '4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3'   # python-3.12.10-embed-amd64.zip
          Write-Host "fetching $url"
          Invoke-WebRequest -Uri $url -OutFile python-embed.zip
          $got = (Get-FileHash python-embed.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $sha256) { throw "python-embed.zip: SHA-256 $got, expected $sha256" }

          $root = 'staging-python/LiS-DE-Ultrawide-Fix'
          New-Item -ItemType Directory -Path 'staging-python' -Force | Out-Null
          Copy-Item -Recurse 'staging/LiS-DE-Ultrawide-Fix' $root
          Expand-Archive -Path python-embed.zip -DestinationPath "$root/tools/python"
          if (-not (Test-Path "$root/tools/python/python.exe")) { throw 'no python.exe in the embeddable archive' }
          # the bundled interpreter has to run the installer, not only exist
          & "$root/tools/python/python.exe" "$root/patcher.py" --version
          if ($LASTEXITCODE -ne 0) { throw 'the bundled Python cannot run patcher.py' }
          Compress-Archive -Path $root -DestinationPath 'LiS-DE-Ultrawide-Fix-bundled-with-Python.zip'
          Get-ChildItem 'LiS-DE-Ultrawide-Fix.zip', 'LiS-DE-Ultrawide-Fix-bundled-with-Python.zip' | Select-Object Name, Length

      # Available on pull requests too, so a build can be tested before it ships.
      - uses: actions/upload-artifact@v7
        with:
          name: LiS-DE-Ultrawide-Fix
          path: staging/LiS-DE-Ultrawide-Fix
      - uses: actions/upload-artifact@v7
        with:
          name: LiS-DE-Ultrawide-Fix-bundled-with-Python
          path: staging-python/LiS-DE-Ultrawide-Fix

      # The tag is the version stamped above - date plus run number: readable,
      # ordered, and unique even for two pushes on the same day, so no release
      # ever replaces another, and the build reports the tag it ships under. The
      # zips keep fixed names, which is what makes the README's
      # /releases/latest/ download links work for every future release.
      - name: Publish the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $run = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          $notes = @(
            (git log -1 --pretty=%s),
            '',
            'Download **LiS-DE-Ultrawide-Fix.zip** (recommended), unpack it anywhere and run `LiSUltrawidePatcher.exe` on Windows or `python3 patcher.py` on Linux and the Steam Deck.',
            '',
            'It runs with the Python already on the machine. On a Windows PC without one, `LiSUltrawidePatcher.exe` downloads a private copy (~11 MB) into its own folder.',
            '',
            '**LiS-DE-Ultrawide-Fix-bundled-with-Python.zip** is the same fix with that copy of Python already inside, so nothing is downloaded. The bundled Python is only used on Windows.',
            '',
            ('Built from `${{ github.sha }}` by [this run](' + $run + ').')
          ) -join "`n"
          gh release create $tag 'LiS-DE-Ultrawide-Fix.zip' 'LiS-DE-Ultrawide-Fix-bundled-with-Python.zip' --title $tag --notes $notes
