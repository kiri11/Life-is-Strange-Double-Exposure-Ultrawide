[UserSettings]
; Set to "auto" to automatically detect monitor resolution, or specify (e.g. "5120x2160", "3440x1440")
Resolution="auto"
Enabled=true

; ==============================================================================
; LIFE IS STRANGE: DOUBLE EXPOSURE - TRUE HOR+ ULTRAWIDE FIX (in-memory)
; Equivalent to `patcher.py --mode horplus`, applied at launch without touching
; the exe on disk.
;
; Features:
; - True Hor+ everywhere: cutscenes, dialogues and exploration keep the full
;   16:9 vertical framing and gain horizontal FOV. No black bars, 0% vertical
;   crop, no cut heads/chins.
; - Fixes the zoom-in bug when a cutscene hands control back to the player
;   (UE sequencer leaves the axis constraint on MaintainXFOV; forcing the
;   MaintainYFOV branch makes that leftover state irrelevant).
; - 1:1 unskewed Polaroid & photo camera (static projection table).
;
; IMPORTANT: do NOT combine with the old PlayerCamera_Exploration patch that
; wrote the monitor aspect ratio into the UCameraComponent constructor. The
; engine's Hor+ math divides by the AUTHORED aspect ratio (16:9); overwriting
; it re-introduces vertical cropping ("zoom").
; ==============================================================================

; --- Patch 1: Unconstrain all cameras -----------------------------------------
; UCameraComponent::GetCameraView copies bConstrainAspectRatio into the output
; FMinimalViewInfo via a bit-merge:
;   movzx eax, byte [rbx+2B4] ; xor eax,[rdi+4C] ; and eax,1 ; xor [rdi+4C],eax
; Replacing the movzx (7 bytes) with "xor eax,eax + nop5" makes the merge CLEAR
; the flag instead: no more 16:9 pillarbox constraint for any camera, cinematic
; CineCameras included (they call Super::GetCameraView).
[Patch:UnconstrainCameras]
Enabled=true
Pattern="0F B6 83 B4 02 00 00 33 47 4C 83 E0 01"
Offset=0
Value="31 C0 0F 1F 44 00 00"
Match="1"
Module="auto"

; --- Patch 2a+2b: Force the Hor+ (MaintainYFOV) projection branch -------------
; In FMinimalViewInfo::CalculateProjectionMatrixGivenViewRectangle the resolved
; axis-constraint enum (dl) is compared against 2 (MajorAxisFOV) and 1
; (MaintainXFOV); both jump to the Vert- path. Rewriting the immediates to 0xFF
; forces every perspective camera into the MaintainYFOV path, where the engine
; derives vFOV from the authored aspect ratio -> true Hor+.
[Patch:ForceMaintainYFOV_MajorAxis]
Enabled=true
Pattern="3B C1 7E 09 80 FA 02 0F 84 ?? ?? ?? ?? 80 FA 01 0F 84 ?? ?? ?? ??"
Offset=6
Value="FF"
Match="1"
Module="auto"

[Patch:ForceMaintainYFOV_XAxis]
Enabled=true
Pattern="3B C1 7E 09 80 FA FF 0F 84 ?? ?? ?? ?? 80 FA 01 0F 84 ?? ?? ?? ??"
Offset=15
Value="FF"
Match="1"
Module="auto"

; --- Patch 3: Static Photo Projection Lookup Table ----------------------------
[Patch:PhotoCamera_Table]
Enabled=true
Pattern="DF 7C DB 3D 55 55 55 3F 39 8E E3 3F"
Offset=8
Value="aspectratio"
ValueType="float"
Match="1"
Module="auto"

; ==============================================================================
; LEGACY (disabled): old 2-offset "clean" mode - ultrawide exploration with
; pillarboxed 16:9 cutscenes. Only enable this if you disable ALL Hor+ patches
; above; combining them breaks the Hor+ FOV math.
; ==============================================================================
[Patch:Legacy_PlayerCamera_Exploration]
Enabled=false
Pattern="48 8B 87 F0 02 00 00 ?? ?? ?? ?? ?? ?? ?? 48 8B 87 F0 02 00 00 C7 80 B0 02 00 00 3B 8E E3 3F"
Offset=27
Value="aspectratio"
ValueType="float"
Match="1"
Module="auto"
