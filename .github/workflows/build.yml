# Builds LiSUltrawidePatcher.exe from LiSUltrawidePatcher.cs and, for pushes to
# main, publishes it as a release. The exe is deliberately NOT in the repository:
# a committed binary drifts from the source next to it, and nobody can tell by
# looking. Here the only exe that exists is the one this file just compiled.
#
# Every push to main cuts its own release and no release is ever overwritten, so
# a build that turns out bad can always be compared against the one before it.
# Put [skip ci] in the commit subject to push without releasing.
name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # One version number for the whole fix, written here rather than kept in
      # step by hand: the date and this run's number, which is also the release
      # tag. Stamping it into both files before the compile means the exe, the
      # installer and the tag can never disagree about which build they are.
      - name: Stamp the version
        shell: pwsh
        run: |
          $version = '{0}.{1}' -f (Get-Date -Format 'yyyy.MM.dd'), $env:GITHUB_RUN_NUMBER
          # AssemblyVersion takes bare numbers - no zero padding, no leading zeros
          $numeric = ($version -split '\.' | ForEach-Object { [int]$_ }) -join '.'
          Write-Host "version $version (assembly $numeric)"
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8NoBOM

          $py = Get-Content patcher.py -Raw
          $py = $py -replace '(?m)^VERSION = ".+"$', "VERSION = `"$version`""
          Set-Content patcher.py $py -NoNewline -Encoding utf8NoBOM

          $cs = Get-Content LiSUltrawidePatcher.cs -Raw
          $cs = $cs -replace 'AssemblyVersion\(".+?"\)', "AssemblyVersion(`"$numeric`")"
          $cs = $cs -replace 'AssemblyFileVersion\(".+?"\)', "AssemblyFileVersion(`"$numeric`")"
          $cs = $cs -replace 'AssemblyInformationalVersion\(".+?"\)', "AssemblyInformationalVersion(`"$version`")"
          Set-Content LiSUltrawidePatcher.cs $cs -NoNewline -Encoding utf8NoBOM

          Select-String -Path patcher.py -Pattern '^VERSION'
          Select-String -Path LiSUltrawidePatcher.cs -Pattern 'Assembly.*Version\('

      # The stock .NET Framework compiler, present on every Windows image and on
      # every Windows the fix targets. No SDK, no csproj, no restore step. Keep
      # this line and the one in LiSUltrawidePatcher.cs's header identical.
      - name: Compile LiSUltrawidePatcher.exe
        shell: cmd
        run: >
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe
          /win32icon:LiSUltrawidePatcher.ico
          /out:LiSUltrawidePatcher.exe LiSUltrawidePatcher.cs
          /r:System.dll /r:System.Windows.Forms.dll /r:System.Drawing.dll
          /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll

      # What a user needs to run the fix, and nothing else. tools/assetdump is
      # not optional: patcher.py shells out to patch_ui_layout.py for the
      # full-width UI step and drops the Oodle DLL in that same folder, so a zip
      # without it silently installs three of the four parts. The research
      # scripts (audit_offsets, pak, usmap), RESEARCH.md and make_icon.py are
      # not on the runtime path and stay in the repository only.
      - name: Stage the release files
        shell: pwsh
        run: |
          $root = 'staging/LiS-Ultrawide-Fix'
          New-Item -ItemType Directory -Path "$root/tools/assetdump" -Force | Out-Null
          $top = @(
            'LiSUltrawidePatcher.exe',   # the GUI front-end, built above
            'patcher.py',                # the installer, and all the patch logic
            'README.md',                 # install and troubleshooting instructions
            'LICENSE'                    # GPL-3.0: the binary must carry its terms
          )
          $assetdump = @(
            'patch_ui_layout.py',        # entry point patcher.py invokes
            'iostore.py', 'zen.py', 'slots.py', 'unver.py',  # container readers
            'oodle.py',                  # loads the decompressor patcher.py fetches
            'blake3_pure.py',            # stdlib BLAKE3, so no wheel is required
            'README.md'                  # where to get Oodle if the fetch fails
          )
          foreach ($f in $top) { Copy-Item $f "$root/$f" }
          foreach ($f in $assetdump) { Copy-Item "tools/assetdump/$f" "$root/tools/assetdump/$f" }
          Compress-Archive -Path $root -DestinationPath 'LiS-Ultrawide-Fix.zip'
          Get-ChildItem -Recurse $root | Select-Object FullName, Length

      # Available on pull requests too, so a build can be tested before it ships.
      - uses: actions/upload-artifact@v4
        with:
          name: LiS-Ultrawide-Fix
          path: staging/LiS-Ultrawide-Fix

      # The tag is the version stamped above - date plus run number: readable,
      # ordered, and unique even for two pushes on the same day, so no release
      # ever replaces another, and the build reports the tag it ships under. The
      # zip keeps a fixed name, which is what makes the README's
      # /releases/latest/ download link work for every future release.
      - name: Publish the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $run = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          $notes = @(
            (git log -1 --pretty=%s),
            '',
            'Download **LiS-Ultrawide-Fix.zip** below, unpack it anywhere and run `LiSUltrawidePatcher.exe`.',
            '',
            ('Built from `${{ github.sha }}` by [this run](' + $run + ').')
          ) -join "`n"
          gh release create $tag 'LiS-Ultrawide-Fix.zip' --title $tag --notes $notes
